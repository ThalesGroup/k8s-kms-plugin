# .goreleaser.yml
#
# Merged from:
#   - branch aarch64-riscv64-build-support  (build matrix, kos, nfpms, signs, release)
#   - security improvement branch           (source-level SBOMs, changelog,
#                                            prerelease:auto, source tarball block)
#
# Signing responsibilities:
#   - Blobs (binaries, checksums, packages, SBOMs): signed here via the `signs` block.
#   - Container image: signed by the publish-release composite action AFTER goreleaser
#     pushes the image. docker_signs is intentionally absent to avoid signing the
#     image twice with different OIDC identities.
#
# SBOM file count: always 3, regardless of how many architectures are built.
#   *.spdx.json     — SPDX via syft   (ISO/IEC 5962)
#   *.cdx.json      — CycloneDX via syft  (OWASP)
#   *.vex.cdx.json  — CycloneDX + VEX via trivy (vulnerability data)

version: 2

project_name: k8s-kms-plugin

env:
  - CGO_ENABLED=1

# `go mod tidy` is deliberately NOT run here: it can rewrite go.mod/go.sum during
# the release, so the published binaries would no longer correspond to the
# dependency set recorded at the tag. Keep the release a pure read of the tag.
before:
  hooks:
    - go mod download

# -- Build -------------------------------------------------------------------
# Cross-compilers are installed by the publish-release composite action (apt-get).
# See .github/actions/setup-build-env/action.yml.
builds:
  - id: k8s-kms-plugin
    binary: '{{ .ProjectName }}_linux_{{ .Arch }}_{{ .Version }}'
    no_unique_dist_dir: true
    main: ./cmd/{{ .ProjectName }}/main.go
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
    goarch:
      - amd64
      - arm64    # aarch64
      - riscv64
    # -trimpath strips the builder's absolute paths from the binary, so builds
    # are reproducible from the tag alone. Paired with mod_timestamp above and
    # matching the kos block, which already sets it.
    flags:
      - -trimpath
    ldflags:
      - "{{ .Env.LDFLAGS }}"
    env:
      - >-
        {{- if eq .Os "linux" }}
          {{- if eq .Arch "amd64"}}CC=gcc{{- end }}
          {{- if eq .Arch "arm64"}}CC=aarch64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "riscv64"}}CC=riscv64-linux-gnu-gcc{{- end }}
        {{- end }}

  # ──────────────────────────────────────────────────────────────────────────
  # create-dev-token — DEVELOPMENT / TESTING helper. NOT part of the k8s-kms-plugin
  # deployable and MUST NOT be run in production.
  #
  # It provisions a throwaway SoftHSMv3 token with well-known PINs and fixed key
  # IDs so users can manually exercise the plugin. Published as a convenience
  # binary only — deliberately excluded from the nfpms packages (see nfpms.ids)
  # and the container image (the ko block builds only ./cmd/k8s-kms-plugin).
  # The "testing-only" marker in the binary name makes the intent obvious on the
  # release page.
  # ──────────────────────────────────────────────────────────────────────────
  - id: create-dev-token
    binary: 'create-dev-token_testing-only_linux_{{ .Arch }}_{{ .Version }}'
    no_unique_dist_dir: true
    main: ./tools/create-dev-token
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
    goarch:
      - amd64
      - arm64    # aarch64
      - riscv64
    flags:
      - -trimpath
    ldflags:
      - "-X main.version={{ .Version }}"
    env:
      - >-
        {{- if eq .Os "linux" }}
          {{- if eq .Arch "amd64"}}CC=gcc{{- end }}
          {{- if eq .Arch "arm64"}}CC=aarch64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "riscv64"}}CC=riscv64-linux-gnu-gcc{{- end }}
        {{- end }}

# -- Container images via ko -------------------------------------------------
# GITHUB_REPOSITORY (e.g. "eclipse-keysealer/k8s-kms-plugin") is set by the workflow.
kos:
  - repositories:
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY }}
    tags:
      - "{{.Tag}}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    main: ./cmd/k8s-kms-plugin
    base_image: "cgr.dev/chainguard/glibc-dynamic:latest"
    bare: true
    preserve_import_paths: false
    platforms:
      - linux/amd64
      # - linux/arm64    # TODO: enable once cross-CGO is wired through ko
      # - linux/riscv64  # TODO: enable once cross-CGO is wired through ko
    flags:
      - -trimpath
    ldflags:
      - "{{ .Env.LDFLAGS }}"
    env:
      - CGO_ENABLED=1
    # OCI annotations on the pushed manifest. GitHub reads
    # org.opencontainers.image.description to populate the ghcr.io package page.
    annotations:
      org.opencontainers.image.description: >-
        gRPC service that leverages a remote or local HSM/TPM to encrypt
        Kubernetes data at-rest with KMS v2.

# -- Linux packages ----------------------------------------------------------
nfpms:
  - id: '{{ .ProjectName }}'
    package_name: '{{ .ProjectName }}'
    # ConventionalFileName renders prerelease deb/rpm names with a tilde
    # (k8s-kms-plugin_1.0.0~rc2_amd64.deb). GitHub does not allow '~' in a
    # release asset name and silently rewrites it to '.', so the published asset
    # no longer matched the name recorded in checksums.txt and in the SLSA
    # provenance subjects. Strip it here so the name goreleaser records is the
    # name users actually download.
    #
    # This only renames the file: the version *inside* the package is still
    # 1.0.0~rc2 (verified with both dpkg control data and rpm headers), so the
    # tilde keeps doing its job of sorting prereleases below the final release.
    file_name_template: '{{ replace .ConventionalFileName "~" "." }}'
    license: "MIT"
    vendor: "ThalesGroup"
    homepage: https://github.com/eclipse-keysealer/k8s-kms-plugin
    maintainer: Thales Open Source <oss@thalesgroup.com>
    description: |-
      gRPC service that leverages a remote or local HSM/TPM to encrypt Kubernetes data at-rest with KMS v2.
    ids:
      - k8s-kms-plugin
    formats:
      - apk
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    contents:
      - src: /usr/bin/{{ .ProjectName }}_linux_{{ .Arch }}_{{ .Version }}
        dst: /usr/bin/{{ .ProjectName }}
        type: "symlink"
      - src: configs/config.example.yaml
        dst: /etc/{{ .ProjectName }}/{{ .ProjectName }}.config.example.yaml
        type: "config"
      - src: deployments/k8s/encryption-conf-kmsv2-unix-socket.yaml
        dst: /etc/{{ .ProjectName }}/kubernetes/manifest/encryption-conf-kmsv2-unix-socket.example.yaml
        type: "config"
      - src: configs/systemd/k8s-kms-plugin.service
        dst: /lib/systemd/system/{{ .ProjectName }}.service
        type: config

# -- Archives ----------------------------------------------------------------
archives:
  # Deployable: k8s-kms-plugin only. Scoped via ids so the testing helper is
  # never bundled into the production artifacts.
  - id: binary-uncompressed
    ids:
      - k8s-kms-plugin
    formats:
      - binary
    name_template: "{{ .Binary }}"
    allow_different_binary_count: true
  - id: binary-compressed-archives
    ids:
      - k8s-kms-plugin
    formats:
      - zip
      - tar.gz
    name_template: "{{ .Binary }}"
    allow_different_binary_count: true
  # Testing helper: shipped as a standalone raw binary, separate from the
  # deployable archives above. NOT for production use.
  - id: dev-tool-create-dev-token
    ids:
      - create-dev-token
    formats:
      - binary
    name_template: "{{ .Binary }}"
    allow_different_binary_count: true

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

# -- Checksums ---------------------------------------------------------------
# Filename must match what release.yml passes to verify-attestations as checksum_file.
checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

snapshot:
  version_template: SNAPSHOT-{{ .ShortCommit }}

# -- Source tarball (required for artifacts: source in sboms block) ----------
source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Version }}-source"
  format: tar.gz

# -- SBOMs — 3 files total, fixed regardless of architecture count -----------
sboms:
  - id: source-sbom-spdx
    artifacts: source
    documents:
      - "{{ .ProjectName }}-{{ .Version }}-source.tar.gz.spdx.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"
      - "--enrich"
      - "all"

  - id: source-sbom-cdx
    artifacts: source
    documents:
      - "{{ .ProjectName }}-{{ .Version }}-source.tar.gz.cdx.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "cyclonedx-json=$document"
      - "--enrich"
      - "all"

  # Unlike the syft blocks above, trivy scans the checked-out workspace rather
  # than "$artifact": `trivy fs` does not unpack archives, so pointing it at the
  # source tarball yields an empty SBOM (0 components). The workspace holds the
  # same files the tarball is built from, but it also accumulates goreleaser's
  # own output, so dist/ is excluded to keep this document a description of the
  # source and nothing else — release.yml attests it against the source tarball.
  - id: source-sbom-vex
    artifacts: source
    cmd: trivy
    documents:
      - "{{ .ProjectName }}-{{ .Version }}-source.tar.gz.vex.cdx.json"
    args:
      - "fs"
      - "--format"
      - "cyclonedx"
      - "--scanners"
      - "vuln"
      - "--skip-dirs"
      - "{{ .Env.WORKSPACE }}/dist"
      - "--output"
      - "$document"
      - "{{ .Env.WORKSPACE }}"

# -- Blob signing — keyless cosign (binaries, checksums, packages, SBOMs) ----
# Container image signing is handled separately in the publish-release action.
# Keyless is the default; no COSIGN_EXPERIMENTAL flag needed.
#
# Output format: a single Sigstore bundle per artifact (`-keyless.bundle.json`),
# which carries the signature, the Fulcio certificate and the Rekor inclusion
# proof together. cosign v3 dropped --output-signature/--output-certificate
# (the separate .sig/.pem pair); --bundle is the only supported output.
# Verify with: cosign verify-blob --bundle <artifact>-keyless.bundle.json ...
signs:
  - id: binary-keyless
    cmd: cosign
    signature: "${artifact}-keyless.bundle.json"
    args: [sign-blob, "--bundle=${signature}", "-y", "${artifact}"]
    artifacts: binary
    output: true

  - id: checksum-keyless
    cmd: cosign
    signature: "${artifact}-keyless.bundle.json"
    args: [sign-blob, "--bundle=${signature}", "-y", "${artifact}"]
    artifacts: checksum
    output: true

  - id: package-keyless
    cmd: cosign
    signature: "${artifact}-keyless.bundle.json"
    args: [sign-blob, "--bundle=${signature}", "-y", "${artifact}"]
    artifacts: package
    output: true

  - id: sbom-keyless
    cmd: cosign
    signature: "${artifact}-keyless.bundle.json"
    args: [sign-blob, "--bundle=${signature}", "-y", "${artifact}"]
    artifacts: sbom
    output: true

# -- Changelog ---------------------------------------------------------------
changelog:
  use: github
  sort: asc
  groups:
    - title: "Breaking Changes"
      regexp: '^.*?(break|BREAKING).*?$'
      order: 0
    - title: "New Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 1
    - title: "Bug Fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 2
    - title: "Security"
      regexp: '^.*?sec(\(.+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

# -- Release -----------------------------------------------------------------
release:
  # Safe to leave unconditionally true alongside prerelease:auto — goreleaser
  # forces make_latest to false whenever it has flagged the tag as a prerelease
  # (internal/client/github.go), so rc/alpha/beta tags never take the "latest"
  # label away from the last stable release.
  make_latest: true
  prerelease: auto
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: '{{ .ProjectName }}'
  footer: |
    ### Thanks to all contributors!
