# .github/workflows/secret-scan.yml
#
# Scans the repository (full history on push, the diff on PRs) for committed
# secrets — API keys, tokens, private keys, HSM PINs — using Gitleaks.
#
# Note: GitHub also offers native secret scanning (Settings > Code security),
# free for public repos. This workflow adds in-CI / PR-gating coverage on top.

name: Secret Scan

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0 # full history so push scans cover the new commits

      - name: Run Gitleaks
        # gitleaks/gitleaks-action v2.3.9
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub organization accounts.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
