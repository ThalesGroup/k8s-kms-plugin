# .github/workflows/gosec.yml
#
# Runs gosec (https://github.com/securego/gosec) — a static-analysis security
# scanner for Go code. Complements govulncheck.yml (dependency CVEs) by
# flagging insecure code patterns in this module itself. Runs on PRs, pushes to
# master, and weekly so newly added rules surface even without a code change.

name: Security Scan (gosec)

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  schedule:
    # Every Monday at 08:00 UTC — same cadence as the other security workflows
    - cron: "0 8 * * 1"
  workflow_dispatch:
  # Allows the Release pipeline to gate a tag on a passing security scan.
  workflow_call:

permissions:
  contents: read

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # actions/setup-go v6.4.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      # Pinned to gosec master (x/tools v0.52.0) instead of the v2.29.0 release:
      # v2.29.0 links x/tools v0.49.0, which cannot decode the go1.27.2 export
      # data (version 5 > maximum supported 4) and fails the scan. Move back to a
      # tagged release once one ships x/tools >= v0.50.0.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@71577268350e1e0f2f1491de1ef53f1227b43c1f # master, x/tools v0.52.0

      - name: Run gosec
        run: gosec ./...
