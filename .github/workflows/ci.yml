# .github/workflows/ci.yml
#
# Continuous integration for pull requests and pushes: vet + build. This is the
# fast, HSM-free gate that keeps master compiling — the release pipeline
# (release.yml) only runs on tags and the security suite (security.yaml) only
# scans, so without this nothing type-checks a PR.
#
# Tests are intentionally NOT run here. The suite needs a SoftHSMv3 PKCS#11
# module at runtime:
#
#   SOFTHSM3_MODULE=.../libsofthsmv3.so go test ./...
#
# and libsofthsmv3.so is not yet distributed as a prebuilt artifact — building
# it from C++ source on every run would be slow and fragile. `go build` has no
# such dependency. Add a test job once libsofthsmv3.so can be provisioned
# (prebuilt download or a cached build step).

name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

env:
  # The module pins crypto11/gose/pkcs11-go via local `replace` directives that
  # do not exist on the runner; resolve everything from the committed vendor/
  # tree explicitly rather than relying on Go's implicit vendor auto-detection.
  GOFLAGS: -mod=vendor
  # The plugin links the PKCS#11 stack through cgo.
  CGO_ENABLED: "1"

jobs:
  build:
    name: Vet & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        # actions/setup-go v6.4.0
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...
