# .github/workflows/ci.yml
#
# Continuous integration for pull requests and pushes: vet + build. This is the
# fast, HSM-free gate that keeps master compiling — the release pipeline
# (release.yml) only runs on tags and the security suite (security.yaml) only
# scans, so without this nothing type-checks a PR.
#
# Unit tests (pkg/, cmd/) run here without an HSM and are used as the compile
# gate. e2e and integration tests self-skip cleanly when PKCS11_MODULE is not
# set.
#
# The hsm-integration job below supplies PKCS11_MODULE from a SoftHSMv2 `main`
# build with ML-KEM/ML-DSA enabled (see .github/actions/setup-softhsmv2-pqc),
# so the HSM-backed suites actually run. This is the SoftHSMv2 path and is
# additive: the SoftHSMv3 (pqctoday-hsm) path is configured separately and is
# not touched here.

name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

env:
  # The plugin links the PKCS#11 stack through cgo.
  CGO_ENABLED: "1"

jobs:
  build-test:
    name: Vet, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # actions/setup-go v6.4.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        # e2e and integration suites skip cleanly when PKCS11_MODULE is unset.
        # Unit tests in pkg/ and cmd/ run unconditionally.
        run: go test -count=1 ./...

  hsm-integration:
    name: HSM integration & e2e (SoftHSMv2 PQC)
    # ubuntu-26.04 ships OpenSSL 3.5, which SoftHSMv2 needs for ML-KEM/ML-DSA.
    # ubuntu-24.04 ships OpenSSL 3.0.13 and cannot build the PQC module.
    runs-on: ubuntu-26.04
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Builds SoftHSMv2 main with ML-KEM/ML-DSA against the runner's OpenSSL
      # 3.5 and exports PKCS11_MODULE. The apt softhsm2 on ubuntu-24.04 is
      # 2.6.1: it advertises wrong HMAC key sizes and has no ML-KEM/ML-DSA.
      - name: Set up SoftHSMv2 (PQC)
        uses: ./.github/actions/setup-softhsmv2-pqc

      - name: Install grpcurl
        # The e2e suite drives the plugin's KMS v2 gRPC API with grpcurl.
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest

      - name: Build plugin binary
        # The e2e suite execs dist/k8s-kms-plugin.
        run: make build

      - name: Run integration tests
        # TestMain bootstraps an ephemeral token via the PKCS#11 API when
        # PKCS11_MODULE is set — no softhsm2-util pre-init required.
        env:
          PKCS11_PIN: '1234'
        run: make test-integration

      - name: Run e2e tests
        env:
          PKCS11_PIN: '1234'
        run: make test-e2e
